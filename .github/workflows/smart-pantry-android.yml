name: Smart Pantry – Android APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Deployed web app URL the Android app should open"
        required: true
  push:
    paths: ["smart-pantry/**"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: smart-pantry } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npx cap sync android
        env: { APP_URL: "${{ inputs.app_url || vars.SMART_PANTRY_URL }}" }
      - run: ./gradlew assembleDebug
        working-directory: smart-pantry/android
      - uses: actions/upload-artifact@v4
        with:
          name: smart-pantry-debug-apk
          path: smart-pantry/android/app/build/outputs/apk/debug/app-debug.apk
